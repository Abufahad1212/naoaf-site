<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نواف | حساباتي</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#ffffff;
    --card:#ffffff;
    --text:#111;
    --sub:#666;
    --btn:#6b7280;
}

body.dark{
    --bg:#0f172a;
    --card:#1e293b;
    --text:#fff;
    --sub:#cbd5e1;
    --btn:#334155;
}

body{
    margin:0;
    font-family:'Cairo', Arial;
    background:var(--bg);
    color:var(--text);
    text-align:center;
    transition:0.4s;
}

.topbar{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:15px;
}

.topbar button{
    padding:8px 14px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#6b7280;
    color:white;
    font-size:18px;
    font-family:'Cairo', Arial;
}

.profile-img{
    width:160px;
    height:160px;
    border-radius:50%;
    margin-top:20px;
    object-fit:cover;
    border:4px solid #ddd;
}

h1{
    margin:15px 0;
    font-size:26px;
}

.bio{
    font-size:16px;
    color:var(--sub);
    padding:0 15px;
    line-height:1.9;
}

.card{
    width:90%;
    max-width:400px;
    margin:20px auto;
    padding:20px;
    border-radius:20px;
    background:var(--card);
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

.link-btn{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:12px 0;
    padding:16px;
    border-radius:14px;
    color:white;
    text-decoration:none;
    font-size:17px;
    font-weight:600;
    background:var(--btn);
    transition:0.25s;
}

.link-btn:hover{
    transform:scale(1.05);
}

.link-btn:active{
    transform:scale(0.96);
}

.app-icon{
    position:absolute;
    left:12px;
    width:22px;
}

/* زر الثلاث نقاط داخل كل زر */
.share-btn{
    position:absolute;
    right:10px;
    top:10px;
    background:none;
    border:none;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.footer{
    margin:35px 15px;
    font-size:15px;
    color:var(--sub);
    line-height:1.8;
}
</style>
</head>

<body>

<div class="topbar">
<button id="themeBtn" onclick="toggleTheme()">ليلي</button>
<button onclick="shareSite()">مشاركة</button>
</div>

<img src="https://i.ibb.co/LX1DxdTf/image.png" class="profile-img">

<h1>تابعني ولك الأجر إن شاءالله</h1>

<div class="bio">
محتوى ديني هادف يذكّر وينفع بإذن الله
<br><br>
"خذ ما شئت فهو لله"
</div>

<div class="card">
<div class="links">

<!-- انستقرام -->
<a class="link-btn" href="https://www.instagram.com/r.3jg">
<img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" class="app-icon">
انستقرام
<button class="share-btn" onclick="shareLink(event,'https://www.instagram.com/r.3jg')">⋮</button>
</a>

<!-- تيك توك -->
<a class="link-btn" href="https://www.tiktok.com/@y10fl">
<img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png" class="app-icon">
تيك توك
<button class="share-btn" onclick="shareLink(event,'https://www.tiktok.com/@y10fl')">⋮</button>
</a>

<!-- واتساب -->
<a class="link-btn" href="https://whatsapp.com/channel/0029VbC22eZGE56qdLDPyr3P">
<img src="https://cdn-icons-png.flaticon.com/512/733/733585.png" class="app-icon">
قناة واتساب
<button class="share-btn" onclick="shareLink(event,'https://whatsapp.com/channel/0029VbC22eZGE56qdLDPyr3P')">⋮</button>
</a>

<!-- يوتيوب -->
<a class="link-btn" href="https://youtube.com/@zamtc">
<img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" class="app-icon">
يوتيوب
<button class="share-btn" onclick="shareLink(event,'https://youtube.com/@zamtc')">⋮</button>
</a>

<!-- تيليجرام -->
<a class="link-btn" href="https://t.me/zsmtca">
<img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png" class="app-icon">
تيليجرام
<button class="share-btn" onclick="shareLink(event,'https://t.me/zsmtca')">⋮</button>
</a>

</div>
</div>

<div class="footer">
أحاول اترك أثر طيّب 🌹<br><br>
هذه الحسابات صدقه جاريه لي ولوالدي ولمن يتابعني 🤍🌷
</div>

<script>
const themeBtn = document.getElementById("themeBtn");

function updateThemeButton(){
    themeBtn.textContent = document.body.classList.contains("dark") ? "نهاري" : "ليلي";
}

function toggleTheme(){
    document.body.classList.toggle("dark");
    localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
    updateThemeButton();
}

if(localStorage.getItem("theme")==="dark"){
    document.body.classList.add("dark");
}
updateThemeButton();

function shareSite(){
    navigator.share?.({
        title:"نواف",
        text:"تابع حساباتي",
        url:window.location.href
    }) || navigator.clipboard.writeText(window.location.href);
}

/* مشاركة زر داخل كل تطبيق */
function shareLink(event,url){
    event.preventDefault();
    event.stopPropagation();

    if(navigator.share){
        navigator.share({
            title:"رابط",
            url:url
        });
    }else{
        navigator.clipboard.writeText(url);
        alert("تم نسخ الرابط");
    }
}
</script>

</body>
</html>
